<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POMODORO.EXE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1c241e;
    --panel:#26332a;
    --panel-2:#2e3d32;
    --ink:#efe6c8;
    --ink-soft:#8fae8a;
    --red:#e8493c;
    --green:#6abf4b;
    --cream:#efe6c8;
    --accent:var(--red);
    --shadow:#0c110d;
    --border:#0c110d;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'VT323',monospace;font-size:20px;
    background:var(--bg);color:var(--ink);
    display:flex;flex-direction:column;
    image-rendering:pixelated;
  }
  ::selection{background:var(--red);color:#fff}

  /* ---------- barre de titre (draggable) ---------- */
  .titlebar{
    -webkit-app-region:drag;
    background:var(--shadow);
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 14px;flex-shrink:0;
  }
  .titlebar .name{font-family:'Press Start 2P',monospace;font-size:11px;color:var(--ink);letter-spacing:.05em}
  .winbtns{display:flex;gap:8px;-webkit-app-region:no-drag}
  .winbtns button{
    width:16px;height:16px;border:2px solid #000;cursor:pointer;padding:0;
  }
  .winbtns .min{background:var(--cream)}
  .winbtns .max{background:var(--green)}
  .winbtns .cls{background:var(--red)}
  .winbtns button:hover{filter:brightness(1.2)}

  /* ---------- contenu ---------- */
  .app{
    flex:1;overflow-y:auto;
    background:var(--panel);margin:14px;border:2px solid var(--border);
    padding:22px 18px 26px;
    display:flex;flex-direction:column;align-items:center;
  }
  .app::-webkit-scrollbar{width:12px}
  .app::-webkit-scrollbar-track{background:var(--panel)}
  .app::-webkit-scrollbar-thumb{background:var(--shadow);border:2px solid var(--panel)}

  h1{font-family:'Press Start 2P',monospace;font-size:22px;letter-spacing:.06em;
     text-shadow:3px 3px 0 var(--shadow)}
  .tagline{color:var(--ink-soft);margin-top:8px;text-align:center;line-height:1.15;max-width:34ch}

  /* ---------- boutons rétro génériques ---------- */
  .pxbtn{
    font-family:'Press Start 2P',monospace;font-size:10px;color:var(--ink);
    background:var(--panel-2);border:2px solid var(--border);
    box-shadow:4px 4px 0 var(--shadow);
    padding:12px 14px;cursor:pointer;text-transform:uppercase;letter-spacing:.05em;
    transition:none;
  }
  .pxbtn:hover{filter:brightness(1.12)}
  .pxbtn:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--shadow)}
  .pxbtn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .pxbtn.primary{background:var(--accent);color:#fff}

  /* ---------- onglets de mode ---------- */
  .modes{display:flex;gap:12px;margin:22px 0 8px;flex-wrap:wrap;justify-content:center}
  .modes .pxbtn.active{background:var(--accent);color:#fff}

  /* ---------- fruit pixel + timer ---------- */
  .fruitbox{width:210px;margin:18px 0 6px}
  .fruitbox svg{display:block;width:100%;height:auto;shape-rendering:crispEdges;
    filter:drop-shadow(5px 5px 0 var(--shadow))}
  .time{
    font-family:'Press Start 2P',monospace;font-size:44px;margin-top:18px;
    text-shadow:4px 4px 0 var(--shadow);font-variant-numeric:tabular-nums;
  }
  .mode-label{color:var(--ink-soft);margin-top:10px}

  /* ---------- barre de progression segmentée ---------- */
  .pbar{display:flex;gap:4px;margin-top:14px}
  .pbar .seg{width:12px;height:14px;background:var(--shadow);border:2px solid var(--border)}
  .pbar .seg.on{background:var(--accent)}

  /* ---------- graines de cycle ---------- */
  .seeds{display:flex;gap:12px;margin:16px 0 20px}
  .seed{width:16px;height:16px;background:var(--shadow);border:2px solid var(--border)}
  .seed.full{background:var(--accent)}

  /* ---------- contrôles ---------- */
  .controls{display:flex;gap:14px;align-items:center}
  #startBtn{font-size:14px;padding:16px 34px}

  /* ---------- réglages ---------- */
  .settings-panel{
    width:100%;max-width:390px;margin-top:28px;
    background:var(--panel-2);border:2px solid var(--border);
    box-shadow:5px 5px 0 var(--shadow);
    padding:16px 16px 20px;
  }
  .settings-panel h2{font-family:'Press Start 2P',monospace;font-size:11px;
    color:var(--ink-soft);margin-bottom:16px;letter-spacing:.08em}
  .row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;margin-bottom:12px}
  .row label{line-height:1.1}
  .hint{color:var(--ink-soft)}
  input[type=number]{
    width:86px;font-family:'VT323',monospace;font-size:20px;text-align:center;
    background:var(--bg);color:var(--ink);border:2px solid var(--border);
    padding:6px 4px;
  }
  input[type=number]::-webkit-inner-spin-button{opacity:1}
  select{
    font-family:'VT323',monospace;font-size:19px;
    background:var(--bg);color:var(--ink);border:2px solid var(--border);
    padding:7px 10px;cursor:pointer;
  }
  select:focus-visible,input:focus-visible{outline:2px solid var(--red);outline-offset:1px}
  .divider{height:2px;background:var(--border);margin:14px 0}
  .toggle{display:flex;align-items:center;gap:12px;cursor:pointer;margin-bottom:10px}
  .toggle input{
    appearance:none;width:20px;height:20px;background:var(--bg);
    border:2px solid var(--border);cursor:pointer;display:grid;place-content:center;flex-shrink:0;
  }
  .toggle input:checked{background:var(--red)}
  .toggle input:checked::before{content:"✓";color:#fff;font-size:14px;font-family:monospace}
  .soundrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px}
  .mini{font-family:'VT323',monospace;font-size:18px;color:var(--ink);
    background:var(--bg);border:2px solid var(--border);box-shadow:3px 3px 0 var(--shadow);
    padding:6px 12px;cursor:pointer}
  .mini:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--shadow)}
  .filelbl{color:var(--ink-soft);display:block;margin-top:8px;line-height:1.15}
  input[type=file]{display:none}
  input[type=range]{accent-color:var(--red);width:140px}
  .sound-label{margin-bottom:2px}
</style>
</head>
<body>

<div class="titlebar">
  <span class="name">POMODORO.EXE</span>
  <div class="winbtns">
    <button class="min" id="btnMin" title="Réduire" aria-label="Réduire"></button>
    <button class="max" id="btnMax" title="Agrandir" aria-label="Agrandir"></button>
    <button class="cls" id="btnCls" title="Fermer" aria-label="Fermer"></button>
  </div>
</div>

<div class="app">
  <h1>POMODORO</h1>
  <p class="tagline">25 min de focus · 5 min de pause · grande pause tous les 4 fruits</p>

  <div class="modes" role="tablist" aria-label="Mode">
    <button class="pxbtn active" data-mode="focus">Focus</button>
    <button class="pxbtn" data-mode="short">Pause</button>
    <button class="pxbtn" data-mode="long">Grande pause</button>
  </div>

  <div class="fruitbox" id="fruitbox" aria-hidden="true"></div>

  <div class="time" id="time">25:00</div>
  <div class="mode-label" id="modeLabel">Focus — on plante des tomates</div>

  <div class="pbar" id="pbar" title="Progression de l'étape"></div>
  <div class="seeds" id="seeds" title="Pomodoros complétés dans ce cycle"></div>

  <div class="controls">
    <button class="pxbtn" id="resetBtn" title="Réinitialiser">↺</button>
    <button class="pxbtn primary" id="startBtn">Démarrer</button>
    <button class="pxbtn" id="skipBtn" title="Étape suivante">⏭</button>
  </div>

  <div class="settings-panel">
    <h2>Réglages</h2>
    <div class="row"><label for="dFocus">Durée focus <span class="hint">(classique : 25)</span></label>
      <input type="number" id="dFocus" min="1" max="120" value="25"></div>
    <div class="row"><label for="dShort">Pause courte <span class="hint">(classique : 5)</span></label>
      <input type="number" id="dShort" min="1" max="60" value="5"></div>
    <div class="row"><label for="dLong">Grande pause <span class="hint">(15–30)</span></label>
      <input type="number" id="dLong" min="1" max="90" value="15"></div>
    <div class="row"><label for="nCycles">Focus avant la grande pause</label>
      <input type="number" id="nCycles" min="2" max="8" value="4"></div>

    <div class="divider"></div>

    <label class="toggle"><input type="checkbox" id="autoNext" checked>
      Enchaîner automatiquement les étapes</label>
    <label class="toggle"><input type="checkbox" id="notif">
      Notification système à la fin d'une étape</label>

    <div class="divider"></div>

    <div class="sound-label">Son de fin</div>
    <div class="soundrow">
      <select id="soundSel">
        <option value="bell">Cloche</option>
        <option value="marimba">Marimba</option>
        <option value="ding">Ding</option>
        <option value="chirp">Oiseau</option>
        <option value="custom" disabled id="customOpt">Son importé</option>
      </select>
      <button class="mini" id="testSound">▶ écouter</button>
      <label class="mini" for="soundFile">📁 importer…</label>
      <input type="file" id="soundFile" accept="audio/*">
    </div>
    <span class="filelbl" id="fileLbl">Tu peux importer ton propre son (mp3/wav).</span>

    <div class="divider"></div>
    <div class="row"><label for="vol">Volume</label>
      <input type="range" id="vol" min="0" max="1" step="0.05" value="0.7"></div>
  </div>
</div>

<script>
/* ================= pixel art ================= */
/* Légende : chaque lettre = une couleur, "." = transparent */
const PAL = {
  k:"#0c110d",                     // contour
  G:"#6abf4b", H:"#3d7a2e",        // verts
  R:"#e8493c", D:"#b53228", P:"#f59a90", // tomate
  Y:"#e8d44d", L:"#f5ea9a", d:"#b8a52f", // citron
  M:"#f0708d", W:"#efe6c8", s:"#0c110d", // pastèque
};
const SPRITES = {
focus:[ // 🍅 tomate
"......GG........",
"......GG........",
"..HH..GG..HH....",
"...HHHGGHHH.....",
"....HHGGHH......",
"...kkkkkkkkkk...",
"..kRRRRRRRRRRk..",
".kRPPRRRRRRRRRk.",
".kRPPkkRRRkkRRk.",
"kRRRRkkRRRkkRRRk",
"kRRRRRRRRRRRRRRk",
"kRRRRRkRRRkRRRRk",
".kRRRRRkkkRRRRk.",
".kDDRRRRRRRRDDk.",
"..kkkkkkkkkkkk..",
],
short:[ // 🍋 citron
"..........HH....",
".........HH.....",
"...kkkkkHH......",
"..kYYYYYYYkk....",
".kYLLYYYYYYYk...",
"kYLLYkkYYkkYYk..",
"kYYYYkkYYkkYYYk.",
"kYYYYYYYYYYYYYk.",
"kYYYYYkYYYkYYYk.",
".kdYYYYkkkYYYdk.",
"..kkkkkkkkkkkk..",
],
long:[ // 🍉 pastèque
"....kkkkkkkk....",
"..kkMMMMMMMMkk..",
".kMMsMMMMMMsMMk.",
".kMMMMkkMkkMMMk.",
"kMMMMMkkMkkMMMMk",
"kMMsMMMMMMMMsMMk",
"kMMMMMkMMMkMMMMk",
".kMMMMMkkkMMMMk.",
".kWWWWWWWWWWWWk.",
"kGGGGGGGGGGGGGGk",
".kGGGGGGGGGGGGk.",
"..kkkkkkkkkkkk..",
],
};
function renderSprite(name){
  const g = SPRITES[name], rows = g.length, cols = g[0].length;
  let rects = "";
  for(let y=0;y<rows;y++) for(let x=0;x<cols;x++){
    const c = g[y][x];
    if(c!=="." && PAL[c]) rects += `<rect x="${x}" y="${y}" width="1" height="1" fill="${PAL[c]}"/>`;
  }
  return `<svg viewBox="0 0 ${cols} ${rows}" xmlns="http://www.w3.org/2000/svg">${rects}</svg>`;
}

/* ================= state & settings ================= */
const COLORS = {focus:"#e8493c", short:"#e8d44d", long:"#f0708d"};
const LABELS = {focus:"Focus — on plante des tomates", short:"Pause courte — respire", long:"Grande pause — tu l'as méritée"};
const NOTIF_TXT = {focus:"Focus terminé ! Petite pause 🍋", short:"Pause finie — on replante 🍅", long:"Grande pause finie — nouveau cycle 🍅"};
const TITLE_ICON = {focus:"🍅", short:"🍋", long:"🍉"};
const PBAR_SEGS = 20;

const $ = id => document.getElementById(id);
const els = {
  time:$("time"), fruitbox:$("fruitbox"), modeLabel:$("modeLabel"),
  start:$("startBtn"), reset:$("resetBtn"), skip:$("skipBtn"),
  seeds:$("seeds"), pbar:$("pbar"), vol:$("vol"), soundSel:$("soundSel"),
};

let settings = {focus:25, short:5, long:15, cycles:4, auto:true, notif:false, sound:"bell", vol:0.7};
try{
  const raw = localStorage.getItem("pomodoro-settings");
  if(raw) settings = {...settings, ...JSON.parse(raw)};
}catch(e){}
function saveSettings(){ try{ localStorage.setItem("pomodoro-settings", JSON.stringify(settings)); }catch(e){} }

let mode = "focus", completed = 0, running = false, endAt = null, tick = null;
let remaining = settings.focus*60;

/* ================= audio ================= */
let actx = null, customBuffer = null, masterGain = null;
function ctx(){ if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)(); return actx; }
function master(){ const c=ctx(); if(!masterGain){masterGain=c.createGain();masterGain.connect(c.destination);} masterGain.gain.value=settings.vol; return masterGain; }
function env(g,t0,a,d,peak){ g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(peak,t0+a); g.gain.exponentialRampToValueAtTime(0.001,t0+a+d); }
function tone(freq,type,t0,a,d,peak){
  const c=ctx(),o=c.createOscillator(),g=c.createGain();
  o.type=type;o.frequency.value=freq;o.connect(g);g.connect(master());
  env(g,t0,a,d,peak);o.start(t0);o.stop(t0+a+d+.05);
}
const SOUNDS = {
  bell(){ const t=ctx().currentTime; [880,1320,1760].forEach((f,i)=>tone(f,"sine",t,0.01,1.6-i*.3,.5/(i+1))); },
  marimba(){ const t=ctx().currentTime; [523,659,784,1047].forEach((f,i)=>tone(f,"sine",t+i*.16,0.005,.5,.55)); },
  ding(){ const t=ctx().currentTime; tone(1568,"triangle",t,0.005,.7,.6); tone(3136,"sine",t,0.005,.4,.15); },
  chirp(){ const c=ctx(),t=c.currentTime;
    for(let i=0;i<3;i++){ const o=c.createOscillator(),g=c.createGain();
      o.type="sine";o.frequency.setValueAtTime(1800,t+i*.25);
      o.frequency.exponentialRampToValueAtTime(2600,t+i*.25+.12);
      o.connect(g);g.connect(master());env(g,t+i*.25,.01,.18,.4);
      o.start(t+i*.25);o.stop(t+i*.25+.25);} },
  custom(){ if(!customBuffer) return SOUNDS.bell();
    const c=ctx(),s=c.createBufferSource();s.buffer=customBuffer;s.connect(master());s.start(); }
};
function playSound(){ master(); (SOUNDS[settings.sound]||SOUNDS.bell)(); }

/* ================= timer core ================= */
function durationFor(m){ return {focus:settings.focus, short:settings.short, long:settings.long}[m]*60; }

function render(){
  const total = durationFor(mode);
  const secs = running ? Math.max(0, Math.round((endAt-Date.now())/1000)) : remaining;
  const mm = String(Math.floor(secs/60)).padStart(2,"0");
  const ss = String(secs%60).padStart(2,"0");
  els.time.textContent = `${mm}:${ss}`;
  document.title = `${mm}:${ss} ${TITLE_ICON[mode]} POMODORO.EXE`;
  const done = Math.round(PBAR_SEGS * (1 - secs/total));
  [...els.pbar.children].forEach((seg,i)=>seg.classList.toggle("on", i<done));
  return secs;
}

function setMode(m, {resetSeeds=false}={}){
  mode = m;
  if(resetSeeds) completed = 0;
  document.documentElement.style.setProperty("--accent", COLORS[m]);
  els.fruitbox.innerHTML = renderSprite(m);
  els.modeLabel.textContent = LABELS[m];
  document.querySelectorAll(".modes .pxbtn").forEach(b=>b.classList.toggle("active", b.dataset.mode===m));
  stop();
  remaining = durationFor(m);
  render(); renderSeeds();
}

function start(){
  ctx().resume && ctx().resume();
  endAt = Date.now() + remaining*1000;
  running = true;
  els.start.textContent = "Pause";
  tick = setInterval(()=>{ if(render()<=0) finish(); }, 250);
}
function stop(){
  if(running){ remaining = Math.max(0, Math.round((endAt-Date.now())/1000)); }
  running = false; clearInterval(tick);
  els.start.textContent = "Démarrer";
}
function notify(finishedMode){
  if(!settings.notif) return;
  try{
    if(Notification.permission === "granted"){
      new Notification("POMODORO.EXE", {body: NOTIF_TXT[finishedMode], silent:true});
    } else if(Notification.permission !== "denied"){
      Notification.requestPermission();
    }
  }catch(e){}
}
function finish(){
  const finished = mode;
  stop(); playSound(); notify(finished);
  if(mode==="focus"){
    completed++;
    advance((completed % settings.cycles === 0) ? "long" : "short");
  } else {
    if(mode==="long") completed = 0;
    advance("focus");
  }
}
function advance(next){ setMode(next); if(settings.auto) start(); }

/* ================= UI pieces ================= */
function renderSeeds(){
  els.seeds.innerHTML = "";
  for(let i=0;i<settings.cycles;i++){
    const s=document.createElement("div");
    s.className="seed"+(i<completed?" full":"");
    els.seeds.appendChild(s);
  }
}
function buildPbar(){
  els.pbar.innerHTML = "";
  for(let i=0;i<PBAR_SEGS;i++){
    const s=document.createElement("div"); s.className="seg"; els.pbar.appendChild(s);
  }
}

/* ================= events ================= */
els.start.addEventListener("click", ()=> running ? stop() : start());
els.reset.addEventListener("click", ()=>{ stop(); remaining=durationFor(mode); render(); });
els.skip .addEventListener("click", ()=>{ stop(); finish(); });
document.querySelectorAll(".modes .pxbtn").forEach(b=>
  b.addEventListener("click", ()=> setMode(b.dataset.mode)));
document.addEventListener("keydown", e=>{
  if(e.code==="Space" && !["INPUT","SELECT","BUTTON"].includes(e.target.tagName)){
    e.preventDefault(); running ? stop() : start();
  }
});

/* barre de titre */
const ctl = window.winCtl || {minimize(){}, maximize(){}, close(){ window.close(); }};
$("btnMin").addEventListener("click", ctl.minimize);
$("btnMax").addEventListener("click", ctl.maximize);
$("btnCls").addEventListener("click", ctl.close);

/* réglages */
function bindNum(id, key){
  const el = $(id); el.value = settings[key];
  el.addEventListener("change", ()=>{
    const v = Math.max(+el.min, Math.min(+el.max, +el.value||+el.min));
    el.value = v; settings[key] = v; saveSettings();
    if(!running){ remaining = durationFor(mode); render(); }
    renderSeeds();
  });
}
bindNum("dFocus","focus"); bindNum("dShort","short");
bindNum("dLong","long");   bindNum("nCycles","cycles");

$("autoNext").checked = settings.auto;
$("autoNext").addEventListener("change", e=>{ settings.auto = e.target.checked; saveSettings(); });
$("notif").checked = settings.notif;
$("notif").addEventListener("change", e=>{
  settings.notif = e.target.checked; saveSettings();
  if(settings.notif && Notification.permission === "default") Notification.requestPermission();
});

els.soundSel.value = settings.sound==="custom" ? "bell" : settings.sound;
els.soundSel.addEventListener("change", ()=>{ settings.sound = els.soundSel.value; saveSettings(); });
$("testSound").addEventListener("click", ()=>{ master(); playSound(); });

els.vol.value = settings.vol;
els.vol.addEventListener("input", ()=>{ settings.vol = +els.vol.value; if(masterGain) masterGain.gain.value = settings.vol; saveSettings(); });

$("soundFile").addEventListener("change", async e=>{
  const f = e.target.files[0]; if(!f) return;
  try{
    const buf = await f.arrayBuffer();
    customBuffer = await ctx().decodeAudioData(buf);
    $("customOpt").disabled = false;
    els.soundSel.value = "custom"; settings.sound = "custom"; saveSettings();
    $("fileLbl").textContent = `Son importé : ${f.name} (valable pour cette session)`;
    playSound();
  }catch(err){
    $("fileLbl").textContent = "Format non reconnu — essaie un mp3 ou un wav.";
  }
});

/* ================= init ================= */
buildPbar();
setMode("focus", {resetSeeds:true});
</script>
</body>
</html>
